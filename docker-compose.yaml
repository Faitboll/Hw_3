services:
  app:
    env_file: .env
    build: ./app
    ports:
      - "${APP_PORT:-8080}:${PORT:-8080}"
    read_only: true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256Mib
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${PORT}/readyz"]
      interval: 10s
      retries: 3
      timeout: 3s
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:latest
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:  
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
volumes:
  redis_data:
